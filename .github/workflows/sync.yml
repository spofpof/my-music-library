name: Automated Music Sync

on:
  schedule:
    # Runs automatically every day at midnight (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub web UI

jobs:
  run-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow GitHub Actions to commit and push files back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests mutagen

      - name: Run Python Sync Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python sync_music.py

      - name: Commit and push updated songs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add songs.json
          git diff --staged --quiet || git commit -m "Auto-update songs.json [skip ci]"
          git push
